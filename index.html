<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hermes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Hermes</h2>
        <div class="tabs">
          <button class="tab side-tab active" data-list="saved-list">Saved</button>
          <button class="tab side-tab" data-list="history-list">History</button>
        </div>
        <div id="saved-list"></div>
        <div id="history-list" class="hidden"></div>
      </aside>

      <div class="workspace">
        <header class="request-bar">
          <select id="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
          </select>
          <input id="url" type="text" placeholder="https://api.example.com/users" />
          <button id="send">Send</button>
          <input id="name" type="text" placeholder="Name to save as" class="name-input" />
          <button id="save" class="secondary">Save</button>
        </header>

        <main>
          <section class="panel">
            <div class="tabs">
              <button class="tab req-tab active" data-pane="params-pane">Params</button>
              <button class="tab req-tab" data-pane="headers">Headers</button>
              <button class="tab req-tab" data-pane="body">Body</button>
            </div>

            <div id="params-pane" class="pane">
              <div id="params-table"></div>
              <button id="add-param" class="secondary add-btn">+ Add param</button>
            </div>
            <textarea id="headers" class="pane hidden" placeholder="One per line, e.g. Content-Type: application/json"></textarea>
            <textarea id="body" class="pane hidden" placeholder='{"name": "Hermes"}'></textarea>
          </section>

          <section class="panel">
            <div id="status-line"></div>
            <div class="tabs">
              <button class="tab resp-tab active" data-tab="body">Body</button>
              <button class="tab resp-tab" data-tab="headers">Headers</button>
            </div>
            <pre id="response">Send a request to see the response.</pre>
            <pre id="response-headers" class="hidden"></pre>
          </section>
        </main>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
